services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: orbit_pulsar
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    networks:
      - orbit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orbit} -d orbit_pulsar"]
      interval: 5s
      timeout: 5s
      retries: 10

  axum:
    build:
      context: .
      dockerfile: docker/axum/Dockerfile
    image: orbit-axum:0.1.0
    pull_policy: build
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbit-network
    environment:
      PULSAR_DATABASE_URL: postgres://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD}@postgres:5432/orbit_pulsar
      SATURN_DATABASE_URL: postgres://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD}@postgres:5432/orbit_saturn
      BIND: 0.0.0.0:3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      WEB_URL: ${FRONTEND_URL:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      SECRET_KEY_BASE: ${SECRET_KEY:?SECRET_KEY must be set}
      PULSAR_WEB_DIR: /srv/orbit/web/pulsar/build/client
      SATURN_WEB_DIR: /srv/orbit/web/saturn
      PULSAR_STORAGE_DIR: /data/storage/pulsar
      SATURN_STORAGE_DIR: /data/storage/saturn
      TRUST_PROXY: ${TRUST_PROXY:-1}
      SATURN_JOBS: ${SATURN_JOBS:-1}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      DB_POOL: ${DB_POOL:-20}
      RUST_LOG: ${RUST_LOG:-info,tower_http=warn}
    volumes:
      - orbit_storage:/data/storage
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: orbit-nginx:0.1.0
    pull_policy: build
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      axum:
        condition: service_healthy
    networks:
      - orbit-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
  orbit_storage:

networks:
  orbit-network:
    driver: bridge
