<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="orbit-dark-title orbit-dark-desc">
  <title id="orbit-dark-title">Orbit mark (dark)</title>
  <desc id="orbit-dark-desc">Orbit geometric emblem for dark backgrounds with central blue core and two orbiting satellite nodes.</desc>
  <g fill="none" stroke-linecap="round">
