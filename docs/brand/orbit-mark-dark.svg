    <ellipse cx="80" cy="80" rx="60" ry="25" transform="rotate(-24 80 80)" stroke="#58A6FF" stroke-width="2" stroke-opacity="0.5"/>
  </g>
  <circle cx="80" cy="80" r="27" fill="#3B82F6"/>
  <circle cx="80" cy="80" r="14" fill="#FFFFFF" fill-opacity="0.22"/>
  <circle cx="132" cy="57" r="9.5" fill="#F8FAFC" stroke="#0D1117" stroke-width="3"/>
  <circle cx="28" cy="103" r="8" fill="#58A6FF" stroke="#0D1117" stroke-width="3"/>
