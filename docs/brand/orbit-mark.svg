    <ellipse cx="80" cy="80" rx="60" ry="25" transform="rotate(-24 80 80)" stroke="#2781F6" stroke-width="2" stroke-opacity="0.45"/>
  </g>
  <circle cx="80" cy="80" r="27" fill="#2781F6"/>
  <circle cx="80" cy="80" r="14" fill="#FFFFFF" fill-opacity="0.2"/>
  <circle cx="132" cy="57" r="9.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="28" cy="103" r="8" fill="#2781F6" stroke="#FFFFFF" stroke-width="3"/>
</svg>
