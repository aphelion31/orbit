<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-labelledby="orbit-title orbit-desc">
  <title id="orbit-title">Orbit mark</title>
  <desc id="orbit-desc">Orbit geometric emblem with central Orbit Blue core and two orbiting satellite nodes representing Pulsar and Saturn.</desc>
  <g fill="none" stroke-linecap="round">
