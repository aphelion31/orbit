[package]
name = "orbit"
version = "1.1.0"
edition = "2024"
description = "Orbit: unified Pulsar (CS Desk) and Saturn (Project & Backlog) single-binary server"

[dependencies]
pulsar = { path = "../pulsar" }
saturn = { path = "../saturn" }

anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
